{% extends "base.html" %}
{% block title %}Log In - TINDA-PRICE{% endblock %}
{% block content %}
  <div class="login-wrap">
    <div class="login-card">
      <h1>TINDA-PRICE</h1>
      <p class="muted">Sign in to continue.</p>
      <form method="post" class="stacked-form">
        <input type="hidden" name="next" value="{{ next }}">
        <label>Username <input type="text" name="username" required autofocus></label>
        <label>Password <input type="password" name="password" required></label>
        <button type="submit">Log in</button>
      </form>
      <div class="demo-accounts">
        <p class="muted">Demo accounts:</p>
        <ul>
          <li><strong>admin</strong> / admin123 &mdash; full access</li>
          <li><strong>owner</strong> / owner123 &mdash; store owner</li>
          <li><strong>supplier</strong> / supplier123 &mdash; supplier</li>
        </ul>
      </div>
    </div>
  </div>
{% endblock %}
